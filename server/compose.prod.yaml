name: ai-friend

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_JAR: target/ai-friend-server-0.0.1-SNAPSHOT.jar
    image: ai-friend-server:0.0.1
    container_name: ai-friend-server
    network_mode: host
    # Spring Profile 只从仓库外 server.env 读取，避免覆盖封闭联调的 dev 配置。
    env_file:
      - /opt/ai-friend/secrets/server.env
    environment:
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: "8080"
      TZ: UTC
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=UTC
        -Djava.io.tmpdir=/tmp
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=65
        -XX:+ExitOnOutOfMemoryError
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - http://127.0.0.1:8080/api/v1/actuator/health
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
