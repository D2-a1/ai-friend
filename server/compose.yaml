services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_friend
      MYSQL_USER: ai_friend
      MYSQL_PASSWORD: ${AI_FRIEND_DB_PASSWORD:-change-me-local-only}
      MYSQL_ROOT_PASSWORD: ${AI_FRIEND_DB_ROOT_PASSWORD:-change-me-root-local-only}
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - ai_friend_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${AI_FRIEND_DB_ROOT_PASSWORD:-change-me-root-local-only}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ai_friend_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ai_friend_mysql_data:
  ai_friend_redis_data:
