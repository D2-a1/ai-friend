      tags: [Tasks]
      operationId: confirmTaskSession
      summary: 确认、拒绝或取消任务
      description: |
        必须携带 expectedVersion、summaryHash 和当前 allowedActions 中的动作。
        CONFIRM_SEND 一次同时授权摘要绑定的原声和转写文字；单独“嗯、好、对”不得调用确认动作。
        recognizedTemplateId 必须属于当前 owner、类型与动作严格对应，且方言包/模型/阈值版本与任务快照一致。
        recognizedAt 必须落在服务端当前 10 秒确认窗口内；CANCEL 优先级最高且进入不可复活终态。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
