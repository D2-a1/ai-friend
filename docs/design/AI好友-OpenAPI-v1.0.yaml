openapi: 3.1.0

info:
  title: AI好友 API
  version: 1.0.0
  description: |
    AI好友 Android 客户端与 Java 后端的 MVP 契约。

    约束：
    - Base URL 为 `/api/v1`，仅允许 HTTPS；除明确标注的运维中文 HTML 页面外使用 UTF-8 JSON。
    - 时间统一使用 ISO-8601 UTC。
    - 除微信登录、邀请 proof 兑换和受限邀请会话接口外，接口默认需要 Bearer Token。
    - 写操作按接口要求携带 `Idempotency-Key`；同一主体、接口和请求摘要返回原结果，
      相同键对应不同请求摘要返回 `SESSION_CONFLICT` 或通用冲突。
    - `openId`、token、邀请 proof、OAuth code/state、邀请 Cookie、原始音频和消息正文不得进入应用日志。
    - 联系人称呼模板只用于识别发音内容，不得作为说话人身份认证或声纹识别。
    - 必须为 true 的布尔字段使用 `not: { const: false }` 表达；该约束与 `const: true` 等价，并兼容当前 Kotlin 代码生成器。
    - v1.0 使用武冈话主方言包与普通话辅助融合；任务和模板必须携带方言包及处理版本，主辅冲突时追问而非猜测。
    - 微信执行结果只表达客户端能够可信确认的状态，不代表对方已收到、已读或已接听。
  contact:
    name: AI好友项目
  x-author: codex
  x-document-date: 2026-08-27

servers:
  - url: https://api.example.com/api/v1
    description: 生产环境占位地址，发布前替换
  - url: https://api-test.example.com/api/v1
    description: 测试环境占位地址，发布前替换

tags:
  - name: Auth
    description: 微信身份认证和令牌轮换
  - name: Privacy
    description: 授权、撤回、任务历史清除和账号注销
  - name: Invitations
    description: 亲友邀请和同意
  - name: Contacts
    description: 白名单亲友、本机验证和方言称呼
  - name: Audio
    description: 受限音频上传凭证
  - name: VoiceCollection
    description: 封闭测试语音采集、样本查询和删除
  - name: VoiceTemplates
    description: 方言安全指令、称呼和日常指令模板
  - name: Tasks
    description: 方言任务理解、确认和微信渠道结果
  - name: Operations
    description: 与普通用户身份隔离的注销告警浏览器接手确认

security:
  - bearerAuth: []

paths:
  /auth/wechat/sessions:
    post:
      tags: [Auth]
      operationId: createWechatSession
      summary: 使用微信临时 code 登录
      description: 微信 code 只能使用一次；设备证明必须由 Android Keystore 私钥绑定该 code，服务端不得记录原文。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatSessionRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatSessionResponse"
        "409":
          $ref: "#/components/responses/AccountClosureAccepted"
        "403":
          $ref: "#/components/responses/DeviceNotAllowed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamFailure"

  /auth/tokens/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: 轮换访问令牌
      description: Refresh Token 采用 rotation，并与登录设备公钥摘要绑定；检测到重用或设备不匹配时撤销整个 token family。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/DeviceNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /privacy/consents:
    get:
      tags: [Privacy]
      operationId: listMyConsents
      summary: 查询本人的授权状态
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /privacy/consents/{type}:
    put:
      tags: [Privacy]
      operationId: updateMyConsent
      summary: 同意或撤回一类授权
      description: 授权记录追加保存、不覆盖历史；撤回会停用相关能力并触发必要清理。
      parameters:
        - $ref: "#/components/parameters/ConsentType"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsentRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          $ref: "#/components/responses/Conflict"

  /contact-invitations:
    get:
      tags: [Invitations]
      operationId: listContactInvitations
      summary: 查询当前用户未完成的亲友邀请
      description: |
        返回当前 owner 最多 5 个仍未过期且可撤销的邀请摘要，按创建时间倒序排列。
        所有内部处理中状态统一为 WAITING_CONFIRMATION；不得返回 proof、分享地址或亲友已进行到哪一步。
        客户端进程重启后只能据此展示和撤销，不能重建旧分享地址。
      responses:
        "200":
          description: 待处理邀请摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingInvitationListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

    post:
      tags: [Invitations]
      operationId: createContactInvitation
      summary: 创建亲友邀请
      description: |
        创建固定 24 小时、单次、可撤销的邀请。每位老人最多 5 个未完成邀请、每天创建 10 个；
        有效绑定、等待本机验证和未完成邀请合计最多 20 个。
        shareUrl 路径只含无权限公开编号，256 位 proof 只放 URL fragment；客户端必须由用户主动触发微信分享，
        不得记录、解析、持久化或复制完整 shareUrl。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 邀请创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          $ref: "#/components/responses/InvitationLimitReached"
        "429":
          $ref: "#/components/responses/RateLimited"

  /contact-invitations/{invitationId}:
    delete:
      tags: [Invitations]
      operationId: revokeContactInvitation
      summary: 老人撤销未完成邀请
      description: 仅邀请 owner 可以撤销；ACCEPTED、DECLINED、REVOKED、EXPIRED 终态不能恢复。
      parameters:
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 已撤销或同一请求已处理
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/contact-invitation-sessions:
    post:
      tags: [Invitations]
      operationId: createPublicContactInvitationSession
      summary: 使用公开编号和 fragment proof 兑换邀请会话
      description: |
        邀请页从 URL fragment 读取 proof，并仅通过 JSON 请求体提交；成功后必须立即清除地址栏 fragment。
        proof 第一次成功兑换后不可再次使用。服务端设置固定 30 分钟的 HttpOnly、Secure、SameSite=Lax、
        __Host- 邀请 Cookie，并返回同源 CSRF token 和微信 OAuth 入口。
        proof、请求正文、Cookie、OAuth code/state 和完整分享 URL 禁止进入日志、Referer、缓存或第三方脚本。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationSessionRequest"
      responses:
        "201":
          description: 邀请会话已创建
          headers:
            Set-Cookie:
              description: 固定 30 分钟、HttpOnly、Secure、SameSite=Lax 的 __Host- 邀请会话 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSessionCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/InvitationUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /oauth/wechat/invitation-callback:
    get:
      tags: [Invitations]
      operationId: completeWechatInvitationOAuth
      summary: 完成亲友邀请微信 OAuth 回调
      description: |
        仅供微信内浏览器回跳，不由 Android 调用。必须同时校验受限邀请 Cookie 与一次性 state，
        code 只在当前请求内存中使用，禁止进入日志、数据库、Referer、错误详情或重试队列。
        成功只把最小微信主体的密文与 HMAC 绑定到当前邀请会话，不得自动接受邀请；
        无论成功或失败都使用 303 跳转到不含 code/state 的同源固定页面。
      servers:
        - url: https://invite.example.com
          description: 邀请 Web 同源固定入口；由网关转发到后端
      security:
        - invitationSessionAuth: []
      parameters:
        - name: code
          in: query
          required: true
          description: 微信一次性 OAuth code；敏感且禁止记录。
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: state
          in: query
          required: true
          description: 与当前受限邀请会话绑定的一次性随机 state；敏感且禁止记录。
          schema:
            type: string
            minLength: 32
            maxLength: 256
      responses:
        "303":
          description: 已跳转到无敏感查询参数的邀请继续页或统一不可用页
          headers:
            Location:
              description: 同源固定页面，不含 code、state、proof 或身份数据。
              schema:
                type: string
                format: uri
            Cache-Control:
              description: 固定为 no-store。
              schema: {type: string}
            Referrer-Policy:
              description: 固定为 no-referrer。
              schema: {type: string}

  /public/contact-invitation-sessions/current:
    get:
      tags: [Invitations]
      operationId: getCurrentPublicContactInvitationSession
      summary: 查询当前受限邀请会话
      description: |
        仅在微信 OAuth 身份已由服务端验证并绑定到当前邀请会话后返回最少展示信息。
        每次成功查询都签发新的同源 CSRF token 并原子替换服务端摘要，旧 token 立即失效；
        页面只在当前内存中持有该 token，不得写入 URL、Cookie、localStorage/sessionStorage、日志或缓存。
        不返回 openId、proof、内部邀请状态、其他亲友或老人账户数据。
      security:
        - invitationSessionAuth: []
      responses:
        "200":
          description: 当前邀请可进入明确同意页面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSessionViewResponse"
        "410":
          $ref: "#/components/responses/InvitationUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/contact-invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptPublicContactInvitation
      summary: 亲友明确同意成为已绑定亲友
      description: |
        只能使用当前 30 分钟邀请 Cookie 中已经过微信 OAuth 验证的身份。
        OAuth 成功不得自动调用本接口；亲友必须看到邀请用途并明确点击同意。
        服务端在一个事务内复验邀请、会话、微信身份、微信号、数量上限和幂等摘要，
        原子消费邀请并创建 ACTIVE_NO_ALIAS 绑定。OAuth 主体与亲友填写的微信号用途分离；
        微信号只在 HTTPS 请求体中提交，并由服务端加密保存及生成 owner 范围 HMAC。
      security:
        - invitationSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: 已接受并保存定向微信号；等待老人在 App 内登记称呼
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/InvitationUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /public/contact-invitations/decline:
    post:
      tags: [Invitations]
      operationId: declinePublicContactInvitation
      summary: 亲友明确拒绝邀请
      description: |
        明确拒绝后邀请进入不可恢复的 DECLINED 终态并注销邀请会话；不创建绑定，
        未接受的临时微信身份最迟 24 小时内删除。关闭页面或返回微信不调用本接口。
      security:
        - invitationSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineInvitationRequest"
      responses:
        "204":
          description: 已拒绝并注销邀请会话
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/InvitationUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: 分页查询已绑定亲友
      description: 仅返回当前 owner 范围内的最小展示信息，不返回微信好友列表或聊天内容。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContactStatus"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPageResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /contacts/debug-demo:
    post:
      tags: [Contacts]
      operationId: ensureDebugDemoContact
      summary: 准备 Debug 体验联系人
      description: |
        仅在后端 dev/test Profile 注册，用于缺少真实微信资料时打通个人 MVP 演示链。
        同一 owner 重复调用只返回同一个合成联系人；不接收、生成或返回真实微信资料，
        不代表亲友同意或本机微信验证。合成联系人一旦解除绑定，必须保留清理终态并返回冲突，
        不允许原地复活；正式环境不存在此接口。
      responses:
        "200":
          description: 已返回当前 owner 的唯一体验联系人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          $ref: "#/components/responses/Conflict"

  /contacts/{id}/local-verifications:
    post:
      tags: [Contacts]
      operationId: verifyLocalWechatContact
      summary: 完成本机微信联系人验证
      description: |
        仅通过 HTTPS 接收当前目标联系人的最小稳定定位、当前备注及验证证据；
        服务端在请求内存中完成 AES-GCM 加密和域隔离 HMAC，客户端不得自报定位摘要；
        初次验证成功后进入 ACTIVE_NO_ALIAS，录入至少一个有效称呼后才进入 ACTIVE；
        禁止上传好友列表、聊天正文、头像二进制或全屏截图。
      parameters:
        - $ref: "#/components/parameters/ContactId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalVerificationRequest"
      responses:
        "200":
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WechatPageUnverified"

  /contacts/{id}/aliases:
    post:
      tags: [Contacts]
      operationId: createContactAlias
      summary: 新增方言称呼
      description: |
        两段录音必须属于当前用户和 ALIAS_ENROLLMENT 用途。唯一性在当前老人全部有效称呼模板中
        按发音内容判断，不使用 ASR 文字唯一性，也不进行说话人身份识别。两段音频、称呼记录、
        联系人状态与称呼命名空间必须原子提交；未加载经校准的方言模型和阈值时失败关闭。
      parameters:
        - $ref: "#/components/parameters/ContactId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAliasRequest"
      responses:
        "201":
          description: 称呼创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasResponse"
        "400":
          $ref: "#/components/responses/AudioInvalid"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 称呼冲突、数量达到上限或绑定状态不允许
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                phoneticConflict:
                  value:
                    code: ALIAS_PHONETIC_CONFLICT
                    message: 这个称呼与已有称呼发音太像，请换一个
                    data:
                      conflictingContactId: ct_01JEXAMPLE
                    traceId: 01JEXAMPLETRACE
                aliasLimit:
                  value:
                    code: ALIAS_LIMIT_REACHED
                    message: 该亲友最多设置 5 个称呼
                    data: null
                    traceId: 01JEXAMPLETRACE
                templateIncompatible:
                  value:
                    code: TEMPLATE_INCOMPATIBLE
                    message: 当前方言称呼模板暂不可用，请稍后重新录入
                    data: null
                    traceId: 01JEXAMPLETRACE
        "422":
          description: 两遍不一致或声学相似度处于临界区
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                inconsistent:
                  value:
                    code: ENROLLMENT_INCONSISTENT
                    message: 两遍发音不一致，请重新录两遍
                    data: null
                    traceId: 01JEXAMPLETRACE
                borderline:
                  value:
                    code: ALIAS_PHONETIC_BORDERLINE
                    message: 这个称呼发音不够容易区分，请重新录两遍
                    data: null
                    traceId: 01JEXAMPLETRACE

  /contacts/{id}/aliases/{aliasId}:
    delete:
      tags: [Contacts]
      operationId: deleteContactAlias
      summary: 删除方言称呼
      description: 删除后立即停止匹配；允许删除最后一个称呼，绑定转为 ACTIVE_NO_ALIAS。
      parameters:
        - $ref: "#/components/parameters/ContactId"
        - $ref: "#/components/parameters/AliasId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAliasRequest"
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /contacts/{id}:
    delete:
      tags: [Contacts]
      operationId: unbindContact
      summary: 解除亲友绑定
      description: 解除后立即从匹配和允许动作中排除，并异步清理定位、称呼模板及缓存。
      parameters:
        - $ref: "#/components/parameters/ContactId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
