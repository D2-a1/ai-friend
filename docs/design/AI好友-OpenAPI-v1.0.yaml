          type: string
          minLength: 1
          maxLength: 64
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    TaskConfirmationRequest:
      type: object
      required: [action, expectedVersion, summaryHash, recognizedTemplateId, recognizedAt]
      properties:
        action:
          $ref: "#/components/schemas/ConfirmationAction"
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        summaryHash:
          type: string
          minLength: 1
          maxLength: 100
        recognizedTemplateId:
          type: string
          minLength: 1
          maxLength: 64
          description: 本地命中的个人方言安全指令模板。
        recognizedAt:
          type: string
          format: date-time
          description: 必须在当前 10 秒确认窗口内。
      additionalProperties: false
    WechatActionPlan:
      type: object
      required: [planId, action, contactId, summaryHash, minimumRuleVersion, expiresAt, targetSearchLocator, targetLocatorProof]
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 64
        action:
          $ref: "#/components/schemas/WechatActionType"
        contactId:
          type: string
          pattern: "^ct_[A-Za-z0-9]+$"
        audioObjectId:
          type:
            - string
            - "null"
        summaryHash:
          type: string
          maxLength: 100
        minimumRuleVersion:
          type: string
          maxLength: 40
        expiresAt:
          type: string
          format: date-time
        targetSearchLocator:
          type: string
          minLength: 6
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9_-]{5,63}$"
          description: 当前短时动作计划用于微信唯一精确搜索的微信号。仅在 HTTPS 响应、服务端整体加密任务载荷和 Android 当前任务内存中存在；禁止日志、分析、持久化到客户端或界面回显，并由 targetLocatorProof 的盐化摘要绑定。
        targetLocatorProof:
          $ref: "#/components/schemas/WechatTargetLocatorProof"
      additionalProperties: false
      description: 只能描述有限允许动作、当前计划一次性定位证明及完成精确搜索所必需的短时定位；不得包含任意脚本、坐标或聊天正文。
    WechatTargetLocatorProof:
      type: object
      required: [proofVersion, keyId, contactVersion, wechatVersion, locatorVersion, salt, targetLocatorSha256, issuedAt, expiresAt, signature]
      properties:
        proofVersion:
          type: string
          enum: [WECHAT_LOCATOR_PROOF_V1]
        keyId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._+-]{0,59}$"
        contactVersion:
          type: integer
          format: int64
          minimum: 0
        wechatVersion:
          type: string
          minLength: 1
          maxLength: 40
        locatorVersion:
          type: string
          minLength: 1
          maxLength: 40
        salt:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: 当前计划随机 128 位盐；不得跨计划复用。
        targetLocatorSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 版本化稳定定位与当前计划盐计算的 SHA-256，不是服务端 HMAC，也不是定位明文。
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signature:
          type: string
          pattern: "^[A-Za-z0-9_-]{86}$"
          description: 对版本化长度前缀规范字节的 Ed25519 Base64URL 无填充签名。
      additionalProperties: false
      description: 只在当前动作计划有效期内使用；Android 验签并重算定位摘要，任一字段缺失或不一致均停止。
    TaskConfirmationResult:
      type: object
      required: [session, actionPlan]
      properties:
        session:
          $ref: "#/components/schemas/TaskSession"
        actionPlan:
          oneOf:
            - $ref: "#/components/schemas/WechatActionPlan"
            - type: "null"
      additionalProperties: false
    ChannelPartResult:
      type: object
      required: [part, result]
      properties:
        part:
          type: string
          enum: [AUDIO, TEXT, CALL]
        result:
          type: string
          enum: [HANDED_TO_WECHAT, SENT, CALL_STARTED, UNSUPPORTED, FAILED]
        evidenceCode:
          type:
            - string
            - "null"
          maxLength: 80
      additionalProperties: false
    ChannelResultRequest:
      type: object
      required: [planId, summaryHash, result, ruleVersion, occurredAt]
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 64
        summaryHash:
          type: string
          minLength: 1
          maxLength: 100
        result:
          $ref: "#/components/schemas/ChannelResult"
        parts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ChannelPartResult"
        ruleVersion:
          type: string
          minLength: 1
          maxLength: 40
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false
    ChannelResultDetail:
      type: object
      required: [result, parts, occurredAt]
      properties:
        result:
          $ref: "#/components/schemas/ChannelResult"
        parts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ChannelPartResult"
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false

    TaskHistoryDeletion:
