      responses:
        "200":
          description: 已解除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /audio-upload-tickets:
    post:
      tags: [Audio]
      operationId: createAudioUploadTicket
      summary: 获取受限音频上传凭证
      description: |
        每张凭证固定 10 分钟有效，使用不可由客户端指定或复用的唯一对象键，并限制 owner、用途、格式、大小、SHA-256 和 TTL。
        创建请求必须携带幂等键；同键同正文返回同一 audioObjectId 并轮换上传秘密，同键不同正文返回冲突。
        休眠环境音 PRE_WAKE_AMBIENT 不属于允许用途。
        不提供独立“上传完成”接口；任务创建、称呼注册或安全指令注册请求引用 audioObjectId 时即视为提交消费。
        服务端消费前必须校验对象存在性、归属、用途、预期大小、SHA-256、魔数、解码和时长，
        处理时使用同一已验证对象版本并原子标记一次性消费；校验失败、重复消费或已过期时拒绝业务请求。
        未消费和校验失败对象由生命周期任务按期限清理。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAudioUploadTicketRequest"
      responses:
        "201":
          description: 凭证创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioUploadTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamFailure"

  /voice-collection-samples:
    post:
      tags: [VoiceCollection]
      operationId: createVoiceCollectionSample
      summary: 提交一条封闭测试语音样本
      description: |
        仅接受 TEST_VOICE_COLLECTION 用途音频和当前最新 TEST_VOICE_COLLECTION 独立授权，
        授权政策固定为 test-voice-collection-v1。提交前必须在本机试听并人工确认实际发音文字；
        服务端只保存有限类别、提示编码、环境、方言代码、加密复核文字和最多三十天的私有原始音频，
        不返回复核文字，也不进行声纹身份识别。
        样本不得进入正式任务识别、联系人选择或微信执行链。创建后的 trainingEligible 固定为 false；
        只有当前 owner 另行同意 VOICE_MODEL_TRAINING，并对具体样本明确授权后才可变为 true。
        创建接口本身不得捆绑或自动开启训练授权。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoiceCollectionSampleRequest"
      responses:
        "201":
          description: 样本提交成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCollectionSampleResponse"
        "400":
