                $ref: "#/components/schemas/VoiceCollectionDeletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"


  /voice-collection-samples/{sampleId}/training-authorization:
    put:
      tags: [VoiceCollection]
      operationId: updateVoiceCollectionTrainingAuthorization
      summary: 授予或撤回单条测试样本训练资格
      description: |
        采集授权与训练授权严格分离。GRANTED 必须同时命中当前最新
        VOICE_MODEL_TRAINING=GRANTED 和 voice-model-training-v1，并由用户对当前样本明确确认；
        样本还必须已经完成人工文字复核。REVOKED 始终允许。服务端复验 owner、ACTIVE、
        已人工复核、未到期和 expectedVersion，按幂等摘要短事务更新。
        撤回后立即把样本排除在未来训练选择范围之外。本接口不创建训练任务、不执行自动标注、
        不发布模型，也不把样本接入正式识别或微信执行。
      parameters:
        - $ref: "#/components/parameters/VoiceCollectionSampleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVoiceCollectionTrainingAuthorizationRequest"
      responses:
        "200":
          description: 训练资格决定已可靠保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCollectionTrainingAuthorizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
