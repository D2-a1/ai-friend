          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/task-history:
    delete:
      tags: [Privacy]
      operationId: clearMyTaskHistory
      summary: 清除本人的任务录音与历史
      description: |
        异步清除任务原始录音、转写、消息正文、临时音频、最近任务结果和上下文；
        保留账号、亲友绑定、称呼、安全指令、日常指令和设置。
        全部目标存储核验前不得返回 COMPLETED，重复提交复用当前进行中的任务。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedTaskHistoryDeletionRequest"
      responses:
        "202":
          description: 历史清除任务已可靠受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskHistoryDeletionResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /me/task-history-deletion:
    get:
      tags: [Privacy]
      operationId: getMyTaskHistoryDeletion
      summary: 查询本人的任务历史清除状态
      description: 只返回 CLEARING 或 COMPLETED，不返回内部存储步骤、失败原因或百分比。
      responses:
        "200":
          description: 当前或最近一次历史清除状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskHistoryDeletionResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /me/account:
    delete:
      tags: [Privacy]
      operationId: closeMyAccount
      summary: 注销账号并删除全部数据
      description: |
        Android 完成两次明确确认后提交。只有注销任务、账户 DELETING 状态和删除 outbox
        在同一事务中可靠落库后才返回 202；随后撤销所有普通登录凭证和设备会话。
        用户无权查询注销进度，不返回注销任务编号，也不签发删除专用凭证。
        在线数据在受理后 72 小时内删除；同一微信身份只有已满 72 小时且旧账号确实删除完成后才能重新注册。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedAccountClosureRequest"
      responses:
        "202":
          description: 注销申请已可靠受理；客户端应立即清理本地数据并退出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountClosureResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          description: 同键不同正文返回 SESSION_CONFLICT；注销已由其他请求受理时返回 ACCOUNT_CLOSURE_ACCEPTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                requestConflict:
                  value:
                    code: SESSION_CONFLICT
                    message: 请求状态已变化，请刷新后重试
                    data: null
                    traceId: 01JEXAMPLETRACE
                alreadyAccepted:
                  value:
                    code: ACCOUNT_CLOSURE_ACCEPTED
                    message: 注销申请已经受理
                    data: null
                    traceId: 01JEXAMPLETRACE
        "429":
          $ref: "#/components/responses/RateLimited"

  /operations/account-closure-alert-deliveries/{deliveryId}/acknowledgement:
    parameters:
      - name: deliveryId
        in: path
        required: true
        description: PushPlus 告警中携带的随机投递 UUID
        schema:
          type: string
          format: uuid
    get:
      tags: [Operations]
      operationId: getAccountClosureAlertAcknowledgementPage
      summary: 显示注销 P0 告警接手确认页
      description: |
        公开页面只显示固定中文 TOTP 表单，不披露投递是否存在、用户数据或内部状态。
        响应必须禁止缓存、引用来源传播、嗅探和页面嵌套。
      security: []
      responses:
        "200":
          description: 固定中文动态验证码表单
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Operations]
      operationId: acknowledgeAccountClosureAlert
      summary: 使用动态验证码确认接手注销 P0 告警
      description: |
        六位 TOTP 只允许通过表单正文提交，不得进入查询串或日志。
        服务端固定责任组为 ON_CALL，五分钟最多尝试五次，同一 TOTP 时间步只能消费一次。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  description: 当前六位动态验证码
      responses:
        "200":
          description: 已完成唯一接手确认
          content:
            text/html:
              schema:
                type: string
        "400":
          description: 验证码无效、已使用或目标不允许接手
          content:
            text/html:
              schema:
                type: string
        "429":
          description: 五分钟尝试次数已达上限
          content:
            text/html:
              schema:
                type: string
        "503":
          description: 运维身份验证或接手存储暂不可用
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 短期访问令牌；不得放入 URL、日志或崩溃报告。
    invitationSessionAuth:
      type: apiKey
      in: cookie
      name: __Host-ai_friend_invitation
      description: 固定 30 分钟的 HttpOnly、Secure、SameSite=Lax 受限邀请会话；不能登录 App 或调用其他业务接口。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写操作幂等键，建议使用 UUIDv7/ULID；不得复用于不同请求正文。
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 01JEXAMPLE0000000000000000
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 与当前邀请会话绑定的同源 CSRF token；不得进入日志或第三方脚本。
      schema:
        type: string
        minLength: 32
        maxLength: 256
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 0 开始
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 每页数量
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
    ConsentType:
      name: type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConsentType"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^iv_[A-Za-z0-9]+$"
    ContactId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ct_[A-Za-z0-9]+$"
    AliasId:
      name: aliasId
      in: path
      required: true
      schema:
        type: string
        pattern: "^al_[A-Za-z0-9]+$"
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ts_[A-Za-z0-9]+$"
    VoiceCollectionSampleId:
      name: sampleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^vs_[A-Fa-f0-9]{32}$"

  responses:
    BadRequest:
      description: 请求格式或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_FAILED
            message: 请求参数不正确
            data:
              fieldErrors:
                - field: audioObjectId
                  reason: 不能为空
            traceId: 01JEXAMPLETRACE
    AuthRequired:
      description: 未登录或 token 失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUTH_REQUIRED
            message: 请重新登录
            data: null
            traceId: 01JEXAMPLETRACE
    AccountClosureAccepted:
      description: 当前微信身份的注销申请已经受理；只确认受理事实，不提供删除进度
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_CLOSURE_ACCEPTED
            message: 注销申请已经受理
            data: null
            traceId: 01JEXAMPLETRACE
    Forbidden:
      description: 当前主体无权操作目标资源
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DeviceNotAllowed:
      description: 当前 Android Keystore 设备公钥未进入服务器白名单，或设备证明无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DEVICE_NOT_ALLOWED
            message: 这台手机尚未放行
            data: null
            traceId: 01JEXAMPLETRACE
    ConsentRequired:
      description: 缺少本能力所需授权
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CONSENT_REQUIRED
            message: 请先完成相关授权
            data: null
            traceId: 01JEXAMPLETRACE
    NotFound:
      description: 资源不存在或不属于当前主体
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 状态、版本、幂等摘要或唯一约束冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Expired:
      description: 邀请等一次性资源已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvitationUnavailable:
      description: |
        公共邀请不可继续。不存在、proof 错误、已兑换、已接受、已拒绝、已撤销、已过期、
        人数已满或风险阻断均使用相同 code/message，不暴露内部状态。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INVITATION_UNAVAILABLE
            message: 邀请已失效，请联系邀请人重新发送
            data: null
            traceId: 01JEXAMPLETRACE
    RateLimited:
      description: 请求频率超限
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: RATE_LIMITED
            message: 操作太频繁，请稍后再试
            data: null
            traceId: 01JEXAMPLETRACE
    UpstreamFailure:
      description: 外部身份、对象存储等上游依赖失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AudioInvalid:
      description: 音频格式、大小、时长、静音、噪声或有效语音不合格
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: AUDIO_INVALID
            message: 录音不清楚，请重新录制
            data: null
            traceId: 01JEXAMPLETRACE
    EnrollmentInconsistent:
      description: 同类两遍注册录音发音不一致，或四类安全指令彼此冲突/处于临界区而无法可靠区分
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ENROLLMENT_INCONSISTENT
            message: 录音发音不一致或指令之间太相似，请重新录制四类指令
            data: null
            traceId: 01JEXAMPLETRACE
    ContactLimitReached:
      description: 已达到 20 位有效亲友上限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CONTACT_LIMIT_REACHED
            message: 最多绑定 20 位有效亲友
            data: null
            traceId: 01JEXAMPLETRACE
    InvitationLimitReached:
      description: 未完成邀请、每日创建次数或绑定与邀请合计已达到限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INVITATION_LIMIT_REACHED
            message: 邀请数量已满，请先处理现有邀请或绑定
            data: null
            traceId: 01JEXAMPLETRACE
    WechatPageUnverified:
      description: 客户端无法唯一确认当前微信页面/联系人，或微信与规则版本未进入白名单
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: WECHAT_PAGE_UNVERIFIED
            message: 无法确认当前联系人，请停止操作
            data: null
            traceId: 01JEXAMPLETRACE
    SessionConflict:
      description: 会话版本、状态、摘要或允许动作冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SESSION_CONFLICT
            message: 任务状态已变化，请刷新后重试
            data:
              latestVersion: 3
            traceId: 01JEXAMPLETRACE
    SessionExpired:
      description: 会话已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SESSION_EXPIRED
            message: 本次任务已结束，请重新说
            data: null
            traceId: 01JEXAMPLETRACE
    NoContactMatch:
      description: 没有可靠联系人候选
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: NO_CONTACT_MATCH
            message: 没找到这个称呼，请换一种说法
            data: null
            traceId: 01JEXAMPLETRACE
    AsrUnavailable:
      description: 主备语音服务均不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ASR_UNAVAILABLE
            message: 现在听不清，请稍后再试
            data: null
            traceId: 01JEXAMPLETRACE

  schemas:
    ConsentType:
      type: string
      enum:
        - BASIC_IDENTITY
        - MICROPHONE
        - NOTIFICATION
        - ACCESSIBILITY
        - VOICE_TEMPLATE
        - TASK_AUDIO
        - TEST_VOICE_COLLECTION
        - VOICE_MODEL_TRAINING
    ConsentDecision:
      type: string
      enum: [GRANTED, REVOKED]
    ContactStatus:
      type: string
      enum:
        - PENDING_CONSENT
        - PENDING_LOCAL_VERIFY
        - ACTIVE_NO_ALIAS
        - ACTIVE
        - REVERIFY_REQUIRED
        - REVOKED
        - BLOCKED
    AliasCompatibility:
      type: string
      enum: [COMPATIBLE, INCOMPATIBLE]
    AudioPurpose:
      type: string
      enum: [TASK, ALIAS_ENROLLMENT, SAFETY_COMMAND_ENROLLMENT, TEST_VOICE_COLLECTION]
    VoiceCollectionCategory:
      type: string
      enum: [WAKE_WORD, CONTACT_ALIAS, SAFETY_COMMAND, FULL_TASK, NEGATIVE]
    VoiceCollectionEnvironment:
      type: string
      enum: [QUIET, HOME_NOISE, OUTDOOR]
    VoiceCollectionStatus:
      type: string
      enum: [ACTIVE, DELETE_REQUESTED]
    VoiceCollectionReviewStatus:
      type: string
      enum: [PENDING, CONFIRMED]
    SafetyCommandType:
      type: string
      enum: [CONFIRM_SEND, CONFIRM_CALL, CANCEL, REJECT_RETRY]
    RoutineCommandIntent:
      type: string
      enum: [SEND_MESSAGE, VOICE_CALL, VIDEO_CALL]
    Intent:
      type: string
      enum:
        - SEND_MESSAGE
        - VOICE_CALL
        - VIDEO_CALL
        - CONFIRM_SEND
        - CONFIRM_CALL
        - REJECT
        - CANCEL
        - CORRECT
        - HELP
    TaskState:
      type: string
      enum:
        - CREATED
        - PROCESSING
        - AWAITING_SELECTION
        - AWAITING_CONFIRMATION
        - NEEDS_CONTENT_REPEAT
        - NEEDS_RETRY
        - EXECUTING
        - REJECTED
        - CANCELLED
        - SIMULATED
        - COMPLETED
        - PARTIAL
        - FAILED
    AllowedAction:
      type: string
      enum:
        - SELECT_CANDIDATE
        - CONFIRM_SEND
        - CONFIRM_CALL
        - REJECT
        - CANCEL
        - RETRY
    ConfirmationAction:
      type: string
      enum: [CONFIRM_SEND, CONFIRM_CALL, REJECT, CANCEL]
    WechatActionType:
      type: string
      enum: [SEND_AUDIO_AND_TEXT, START_VOICE_CALL, START_VIDEO_CALL]
    ChannelResult:
      type: string
      enum:
        - OPENED
        - HANDED_TO_WECHAT
        - SENT
        - PARTIAL
        - CALL_STARTED
        - UNSUPPORTED
        - FAILED
    TaskHistoryDeletionStatus:
      type: string
      enum: [CLEARING, COMPLETED]

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - AUTH_REQUIRED
            - DEVICE_NOT_ALLOWED
            - CONSENT_REQUIRED
            - AUDIO_INVALID
            - ENROLLMENT_INCONSISTENT
            - ALIAS_PHONETIC_CONFLICT
            - ALIAS_PHONETIC_BORDERLINE
            - CONTACT_LIMIT_REACHED
            - ALIAS_LIMIT_REACHED
            - LOCAL_VERIFICATION_REQUIRED
            - ASR_UNAVAILABLE
            - NO_CONTACT_MATCH
            - AUDIO_SEGMENT_UNCERTAIN
            - SAFETY_COMMAND_REQUIRED
            - TEMPLATE_INCOMPATIBLE
            - SESSION_CONFLICT
            - SESSION_EXPIRED
            - WECHAT_PAGE_UNVERIFIED
            - WECHAT_PARTIAL_SUCCESS
            - WECHAT_RULE_UNSUPPORTED
            - ACTION_UNSUPPORTED
            - ACCOUNT_CLOSURE_ACCEPTED
            - RATE_LIMITED
            - NOT_FOUND
            - FORBIDDEN
            - INTERNAL_ERROR
        message:
          type: string
          maxLength: 300
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        traceId:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false

    WechatSessionRequest:
      type: object
      required: [code, device]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
        device:
          $ref: "#/components/schemas/DeviceContext"
      additionalProperties: false
    DeviceContext:
      type: object
      required: [platform, osVersion, appVersion, publicKeySpkiBase64, proofBase64]
      properties:
        platform:
          type: string
          const: ANDROID
        osVersion:
          type: string
          maxLength: 40
        appVersion:
          type: string
          maxLength: 40
        deviceModel:
          type:
            - string
            - "null"
          maxLength: 80
        publicKeySpkiBase64:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: Android Keystore secp256r1 X.509 SPKI 公钥的标准 Base64
        proofBase64:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: 对登录规范字节执行 SHA256withECDSA 后的标准 Base64
      additionalProperties: false
    RefreshTokenRequest:
      type: object
      required: [refreshToken, publicKeySpkiBase64, proofBase64]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
        publicKeySpkiBase64:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: 与 token family 绑定的 Android Keystore X.509 SPKI 公钥
        proofBase64:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: 对刷新规范字节执行 SHA256withECDSA 后的标准 Base64
      additionalProperties: false
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/CurrentUser"
      additionalProperties: false
    CurrentUser:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          pattern: "^us_[A-Za-z0-9]+$"
        status:
          type: string
          enum: [ACTIVE, DELETING, DELETED]
        displayName:
          type:
            - string
            - "null"
          maxLength: 80
      additionalProperties: false

    Consent:
      type: object
      required: [type, decision, policyVersion, decidedAt]
      properties:
        type:
          $ref: "#/components/schemas/ConsentType"
        decision:
          $ref: "#/components/schemas/ConsentDecision"
        policyVersion:
          type: string
          maxLength: 40
        decidedAt:
          type: string
          format: date-time
      additionalProperties: false
    UpdateConsentRequest:
      type: object
      required: [decision, policyVersion, confirmedAt]
      properties:
        decision:
          $ref: "#/components/schemas/ConsentDecision"
        policyVersion:
          type: string
          minLength: 1
          maxLength: 40
        confirmedAt:
          type: string
          format: date-time
      additionalProperties: false

    Invitation:
      type: object
      required: [invitationId, shareUrl, expiresAt, status]
      properties:
        invitationId:
          type: string
          pattern: "^iv_[A-Za-z0-9]+$"
        shareUrl:
          type: string
          format: uri
          description: |
            固定 24 小时的敏感分享地址，格式为 /invite/{publicInvitationId}#proof={secret}。
            proof 只位于 fragment；完整地址不得进入日志、剪贴板、持久化存储或第三方脚本。
          example: https://invite.example.com/invite/iv_01JEXAMPLE#proof=base64url-secret
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
