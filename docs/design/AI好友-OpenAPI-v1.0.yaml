        candidates:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TaskCandidate"
        spokenSummary:
          type:
            - string
            - "null"
          maxLength: 500
        summaryHash:
          type:
            - string
            - "null"
          maxLength: 100
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AllowedAction"
        channelResult:
          oneOf:
            - $ref: "#/components/schemas/ChannelResultDetail"
            - type: "null"
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    RecentTaskResultIntent:
      type: string
      enum: [SEND_MESSAGE, VOICE_CALL, VIDEO_CALL]
    RecentTaskResult:
      type: object
      required: [sessionId, state, intent, createdAt, updatedAt]
      properties:
        sessionId:
          type: string
          pattern: "^ts_[A-Za-z0-9]+$"
        state:
          $ref: "#/components/schemas/TaskState"
        intent:
          $ref: "#/components/schemas/RecentTaskResultIntent"
        createdAt:
          type: string
          format: date-time
        updatedAt:
