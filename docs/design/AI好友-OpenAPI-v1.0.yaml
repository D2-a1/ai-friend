          description: 与唯一有效原声区间严格对应的临时消息正文；非消息或不可执行状态为空，禁止日志记录。
        effectiveAudioRanges:
          type: array
          minItems: 0
          maxItems: 10
          items:
            $ref: "#/components/schemas/AudioRange"
        corrections:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Correction"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        processingVersions:
          $ref: "#/components/schemas/SpeechProcessingVersions"
      additionalProperties: false
    SpeechProcessingVersions:
      type: object
      required:
        - dialectCode
        - dialectPackageVersion
        - primaryAsrModelVersion
        - mandarinAssistVersion
        - fusionRuleVersion
        - alignmentVersion
        - templateModelVersion
        - thresholdVersion
      properties:
        dialectCode:
          type: string
          minLength: 2
          maxLength: 40
          example: zh-Hans-CN-x-wugang
        dialectPackageVersion:
          type: string
          minLength: 1
          maxLength: 60
        primaryAsrModelVersion:
          type: string
          minLength: 1
          maxLength: 60
        mandarinAssistVersion:
          type: string
          minLength: 1
          maxLength: 60
        fusionRuleVersion:
          type: string
          minLength: 1
          maxLength: 60
        alignmentVersion:
          type: string
          minLength: 1
          maxLength: 60
        templateModelVersion:
          type: string
          minLength: 1
          maxLength: 60
        thresholdVersion:
          type: string
          minLength: 1
          maxLength: 60
      additionalProperties: false
    TaskCandidate:
      type: object
      required: [candidateId, contact, scoreBand, rank]
      properties:
        candidateId:
          type: string
        contact:
          $ref: "#/components/schemas/MatchedContact"
        scoreBand:
          type: string
          enum: [UNIQUE, AMBIGUOUS]
          description: 由已验签方言包的本地声学距离和 Top-1/Top-2 差距阈值分类，不返回原始分数。
        rank:
          type: integer
          minimum: 1
          maximum: 3
      additionalProperties: false
    TaskSession:
      type: object
      required:
        - sessionId
