              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /task-sessions/{id}/channel-results:
    post:
      tags: [Tasks]
      operationId: reportTaskChannelResult
      summary: 上报微信渠道执行结果
      description: |
        只接收受控结果枚举和规则版本，不上传聊天正文、好友列表或截图。
        必须精确绑定当前 planId、summaryHash、规则版本和计划有效期；终态或迟到结果不能恢复会话。
        SENT 必须有可信回执；PARTIAL 不触发自动重发。
        客户端仅把内容交给微信或打开分享界面时最多上报 HANDED_TO_WECHAT；不得把 SDK 回调推定为 SENT。
        原声加文字消息必须按 AUDIO 后 TEXT 上报分部结果；AUDIO 未交给微信时不得继续 TEXT，TEXT 失败不得重发 AUDIO。
        联系人资料页的盐化定位匹配、动作节点数量和脱敏形状摘要只用于客户端本机准入，不得放入本请求或其他公开接口。
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelResultRequest"
      responses:
        "200":
          description: 结果已校验并归档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "409":
          $ref: "#/components/responses/SessionConflict"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "422":
