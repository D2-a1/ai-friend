  /me/safety-command-enrollments:
    post:
      tags: [VoiceTemplates]
      operationId: enrollSafetyCommands
      summary: 注册四类方言安全指令
      description: |
        CONFIRM_SEND、CONFIRM_CALL、CANCEL、REJECT_RETRY 必须各出现一次，每类录两遍，
        八个 SAFETY_COMMAND_ENROLLMENT 音频对象必须互不相同。服务端在事务外完成八段音频
        的精确版本内容复验、同类双录一致性和四类彼此可区分校验；随后整批原子覆盖四类模板，
        并在同一短事务内消费八段音频。任一校验、授权、幂等、并发或持久化失败均不得部分覆盖
        或消费任何一段音频。
        请求的 consentPolicyVersion 必须匹配当前最新 VOICE_TEMPLATE=GRANTED 授权版本。
        同一 Idempotency-Key 与同一正文安全重放；同键不同正文、并发状态变化或旧成功记录不一致
        返回 SESSION_CONFLICT。未加载或不兼容正式签名声学包时返回 TEMPLATE_INCOMPATIBLE，
        不得使用测试阈值、ASR 文字或经验规则降级。未完整注册前不能启用微信联系。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyCommandEnrollmentRequest"
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyCommandEnrollmentResponse"
        "400":
          description: 请求结构/四类集合不合法，或音频编号重复、归属、用途、上传和内容校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationFailed:
                  value:
                    code: VALIDATION_FAILED
                    message: 必须完整提交四类安全指令，每类各录两遍
                    data: null
                    traceId: 01JEXAMPLETRACE
                audioInvalid:
                  value:
                    code: AUDIO_INVALID
                    message: 录音无效，请重新录制四类指令
                    data: null
                    traceId: 01JEXAMPLETRACE
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "409":
          description: 幂等/并发状态冲突，或正式签名声学包缺失、无效、版本不兼容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sessionConflict:
                  value:
                    code: SESSION_CONFLICT
                    message: 请求状态已变化，请重新开始四类安全指令录制
                    data: null
                    traceId: 01JEXAMPLETRACE
                templateIncompatible:
                  value:
                    code: TEMPLATE_INCOMPATIBLE
                    message: 当前方言安全指令模板暂不可用，请稍后重新录入
                    data: null
                    traceId: 01JEXAMPLETRACE
        "422":
          $ref: "#/components/responses/EnrollmentInconsistent"

