      description: |
        明确确认后立即停止展示和任何后续使用，清除类别、提示编码、环境、方言和加密复核文字，
        并把私有原始音频交给可重试的生命周期工作器物理删除。202 只表示删除已可靠受理，
        不声称对象存储已完成物理删除。撤回 TEST_VOICE_COLLECTION 授权会对全部有效样本执行同样处理。
