        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [VoiceCollection]
      operationId: listVoiceCollectionSamples
      summary: 查询本人仍有效的测试语音样本
      description: 只返回当前 owner 的 ACTIVE 最小元数据，最多一百条；已撤权、已请求删除或到期样本不返回。
      responses:
