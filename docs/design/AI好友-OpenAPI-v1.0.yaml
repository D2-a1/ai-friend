        "409":
          $ref: "#/components/responses/Conflict"

  /task-sessions:
    post:
      tags: [Tasks]
      operationId: createTaskSession
      summary: 创建方言任务
      description: |
        服务端校验 TASK 音频对象后完成识别证据复验、纠正解析、声学联系人匹配、意图识别和有效原声切分。
        返回状态、候选、确认摘要、摘要哈希和允许动作；创建任务本身不执行微信操作。
        对象存储、解码、ASR 和声学匹配均在数据库事务外运行；只有任务与候选成功落库后才原子消费音频。
        正式模式下主方言与普通话辅助均使用已验签方言包锁定的模型版本和 SHA-256。
        个人基础体验开关开启时，Android 可使用随 APK 固定发布且已复验摘要的普通话参考模型，
        在本机生成临时转写和词级时间戳；该证据不代表武冈话模型，不得单独决定联系人或动作。
        联系人匹配仅在当前 owner 的 ACTIVE 绑定和兼容称呼中执行；ASR 文字不作为联系人身份证据。
        只有声学 Top-1 达标且与 Top-2 的差距达到已验签阈值时才返回 `UNIQUE`；其他达到候选阈值的结果最多返回 Top 3 `AMBIGUOUS`，即使只有一个边界候选也必须先选择。
        `effectiveAudioRanges` 仅来自有词级时间戳的保守对齐；无法可靠排除动作词、显式作废片段或识别冲突时返回 `AUDIO_SEGMENT_UNCERTAIN`。
        基础体验仍必须通过 owner 范围个人声学称呼匹配、完整复述和明确确认；联系人、
        原声范围或动作无法唯一确认时失败关闭。基础体验开关关闭后，正式 ASR 或已验签方言包不可用时失败关闭。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskSessionRequest"
      responses:
        "201":
          description: 任务创建并完成当前阶段处理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSessionResponse"
              example:
                code: OK
                message: success
                data:
                  sessionId: ts_01JEXAMPLE
                  sessionVersion: 1
                  state: AWAITING_CONFIRMATION
                  understanding:
                    intent: SEND_MESSAGE
                    contact:
                      id: ct_01JEXAMPLE
                      displayName: 李明
                      alias: 二狗子
                    transcript: 二狗子回来吃饭
                    effectiveAudioRanges:
                      - startMs: 1260
                        endMs: 2980
                    corrections: []
                    confidence: 0.91
                    processingVersions:
                      dialectCode: wugang
                      dialectPackageVersion: 1.0.0
                      primaryAsrModelVersion: wugang-asr-1.0.0
                      mandarinAssistVersion: mandarin-assist-1.0.0
                      fusionRuleVersion: fusion-1.0.0
                      alignmentVersion: alignment-1.0.0
                      templateModelVersion: acoustic-template-1.0.0
                      thresholdVersion: threshold-1.0.0
                  candidates: []
                  spokenSummary: 主人，你要发送的内容是二狗子回来吃饭。确认发送吗？
                  summaryHash: sha256:example
                  allowedActions: [CONFIRM_SEND, REJECT, CANCEL]
                  expiresAt: 2026-07-23T08:01:00Z
                traceId: 01JEXAMPLETRACE
        "400":
          $ref: "#/components/responses/AudioInvalid"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/ConsentRequired"
        "409":
          description: 安全指令未配置、模板不兼容或幂等冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 无联系人匹配或原声无法可靠切分
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AsrUnavailable"

