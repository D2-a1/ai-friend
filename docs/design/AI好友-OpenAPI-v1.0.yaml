        - expiresAt
      properties:
        sessionId:
          type: string
          pattern: "^ts_[A-Za-z0-9]+$"
        sessionVersion:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/TaskState"
